<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>منصة زواج</title>
<style>
  :root{
    --bg:#0a0a0a;--bg2:#141414;--card:#1a1a1a;--border:#2a2a2a;
    --gold:#d4af37;--gold-light:#e8c96a;
    --text:#f0f0f0;--text-dim:#999;
    --green:#22c55e;--red:#ef4444;
  }
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);position:fixed;width:100%}

  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}

  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;z-index:10}
  .brand{font-size:18px;font-weight:700;color:var(--gold)}
  .actions{display:flex;gap:12px;align-items:center}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:16px}
  .badge{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:10px;padding:2px 5px;border-radius:8px;font-weight:700}

  /* ============ منطقة البطاقات ============ */
  .deck-area{flex:1;position:relative;overflow:hidden;padding:16px 12px;display:flex;align-items:center;justify-content:center}

  .card-stack{position:relative;width:100%;max-width:400px;height:100%;max-height:560px}

  .card{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:pointer;will-change:transform;backface-visibility:hidden}
  .card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}

  .card.behind-1{transform:scale(.95) translateY(10px);opacity:.7;pointer-events:none}
  .card.behind-2{transform:scale(.9) translateY(20px);opacity:.4;pointer-events:none}
  .card.behind-3{transform:scale(.85) translateY(30px);opacity:.2;pointer-events:none}

  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .card-id{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.5px}
  .card-age{font-size:13px;color:var(--text-dim);margin-top:2px}
  .card-avatar{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--bg2);font-size:34px;flex-shrink:0;box-shadow:0 0 20px rgba(212,175,55,.3)}

  .card-name{text-align:center;font-size:20px;font-weight:800;color:var(--gold-light);margin:8px 0 4px}
  .card-loc{text-align:center;font-size:14px;font-weight:600;margin-bottom:2px}
  .card-nat{text-align:center;font-size:12px;color:var(--text-dim);margin-bottom:14px}

  .mini-details{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
  .mini-detail{display:flex;justify-content:space-between;font-size:13px;gap:6px;padding:6px 0;border-bottom:1px solid rgba(42,42,42,.5)}
  .mini-detail .label{color:var(--text-dim)}
  .mini-detail .value{color:var(--text);font-weight:600}

  .bio-preview{background:var(--bg2);border-right:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.6;color:var(--text);margin-top:12px;font-style:italic}

  .tap-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-dim);opacity:.7;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:20px;white-space:nowrap}

  /* ============ شارات السحب ============ */
  .stamp{position:absolute;top:40px;font-size:36px;font-weight:900;padding:10px 20px;border:4px solid;border-radius:12px;opacity:0;pointer-events:none;transform:rotate(0)}
  .stamp-like{left:30px;color:var(--green);border-color:var(--green);transform:rotate(-20deg)}
  .stamp-nope{right:30px;color:var(--red);border-color:var(--red);transform:rotate(20deg)}

  /* ============ الأزرار ============ */
  .action-buttons{display:flex;justify-content:center;gap:28px;padding:16px 0 max(16px,env(safe-area-inset-bottom));background:var(--bg);flex-shrink:0;position:relative;z-index:10}
  .action-btn{width:64px;height:64px;border-radius:50%;border:2px solid;background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .15s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .action-btn:active{transform:scale(.9)}
  .action-btn.skip{border-color:var(--red);color:var(--red)}
  .action-btn.like{border-color:var(--green);color:var(--green);width:72px;height:72px;font-size:32px}

  /* ============ شريط التنقل ============ */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text-dim);font-size:10px;cursor:pointer;padding:6px 8px;flex:1;position:relative}
  .nav-item.active{color:var(--gold)}
  .nav-icon{font-size:20px}
  .nav-badge{position:absolute;top:2px;left:50%;background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700}

  /* ============ المودال ============ */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:flex-end;z-index:200;backdrop-filter:blur(4px)}
  .modal-overlay.show{display:flex}
  .modal{background:var(--card);width:100%;max-height:90vh;border-radius:24px 24px 0 0;padding:20px;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1);border-top:2px solid var(--gold)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:50px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 18px}
  .modal h2{color:var(--gold);font-size:22px;margin-bottom:4px;text-align:center}
  .modal .sub{color:var(--text-dim);font-size:13px;margin-bottom:18px;text-align:center}

  .section-label{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1.5px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .modal-details{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .m-detail{display:flex;justify-content:space-between;font-size:13px;gap:8px;padding:8px 0;border-bottom:1px solid rgba(42,42,42,.4)}
  .m-detail.full{grid-column:1/-1}
  .m-detail .label{color:var(--text-dim)}
  .m-detail .value{color:var(--text);font-weight:600}

  .bio-box{background:var(--bg2);border-right:3px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.8;margin-top:10px;color:#ddd}

  .marriage-tags{display:flex;flex-wrap:wrap;gap:6px}
  .marriage-tag{background:rgba(212,175,55,.15);color:var(--gold-light);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}

  .modal-actions{display:flex;gap:10px;margin-top:20px;padding-bottom:10px}
  .btn-interest{flex:1;padding:14px;border-radius:30px;border:none;background:var(--gold);color:#000;font-weight:700;font-size:15px;cursor:pointer}
  .btn-close{width:100%;padding:14px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;cursor:pointer;margin-top:10px}

  /* ============ Toast ============ */
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--gold);color:#000;padding:12px 24px;border-radius:30px;font-size:13px;font-weight:700;transition:transform .3s;z-index:300;max-width:85%;text-align:center;box-shadow:0 8px 30px rgba(212,175,55,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* ============ Empty ============ */
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
  .empty-state .big-icon{font-size:64px;margin-bottom:20px;opacity:.5}
  .empty-state h3{color:var(--gold);font-size:20px;margin-bottom:10px;font-weight:700}
  .empty-state p{font-size:13px;line-height:1.7}
  .btn-reset{margin-top:20px;padding:12px 28px;border-radius:30px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;cursor:pointer;font-size:14px}

  #errorBox{display:none;position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:12px;font-size:12px;z-index:9999;direction:ltr;font-family:monospace;white-space:pre-wrap;max-height:50vh;overflow:auto}
</style>
</head>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">

<div class="toast" id="toast"></div>

// ==================== التنقل ====================
function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.nav-item').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-section') === section);
  });
  renderContent();
}

function renderContent() {
  var deckArea = document.getElementById('deckArea');
  var actionButtons = document.getElementById('actionButtons');

  if (currentSection === 'browse') {
    deckArea.style.display = 'flex';
    actionButtons.style.display = 'flex';
    renderCards();
  } else {
    deckArea.style.display = 'none';
    actionButtons.style.display = 'none';
    if (currentSection === 'matches') renderMatches();
    else if (currentSection === 'notifications') renderEmpty('🔔', 'الإشعارات', 'لديك إشعار جديد: تمت إضافة ملف شخصي جديد.');
    else if (currentSection === 'profile') renderMyProfile();
    else if (currentSection === 'help') renderEmpty('❓', 'المساعدة', 'للتواصل مع الدعم: support@example.com');
  }
}

// ==================== بطاقات التيندر ====================

  var stack = document.getElementById('cardStack');

    return likedProfiles.indexOf(p.id) === -1 && skippedProfiles.indexOf(p.id) === -1;
  });
