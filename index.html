.top{position:fixed;top:0;left:0;right:0;height:55px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:10}

.ico{background:#141414;border:1px solid #333;color:#d4af37;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.deck{position:fixed;top:55px;left:0;right:0;bottom:170px;padding:12px}
.stack{position:absolute;top:12px;left:12px;right:12px;bottom:12px;max-width:400px;margin:0 auto}
.card{position:absolute;top:0;left:0;right:0;bottom:0;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:20px;overflow-y:auto;cursor:pointer;z-index:1}

.card.b1{z-index:9;transform:scale(.95) translateY(8px);opacity:.7;pointer-events:none}
.card.b2{z-index:8;transform:scale(.9) translateY(16px);opacity:.4;pointer-events:none}
.av{width:70px;height:70px;border-radius:50%;border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;background:#141414;font-size:34px;float:left}
.nm{color:#e8c96a;font-size:20px;font-weight:800;text-align:center;margin:10px 0 4px;clear:both}
.lc{text-align:center;font-size:14px;font-weight:600;margin-bottom:14px}
.rw{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px}
.rw .l{color:#888}
.rw .v{font-weight:600}
.bio{background:#141414;border-right:3px solid #d4af37;padding:10px;border-radius:8px;font-size:12px;margin-top:12px;line-height:1.6}
.btns{position:fixed;bottom:70px;left:0;right:0;height:100px;display:flex;justify-content:center;gap:30px;align-items:center;background:#0a0a0a;z-index:10}
.btn{width:64px;height:64px;border-radius:50%;border:2px solid;background:#141414;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px}
.btn.no{border-color:#ef4444;color:#ef4444}
.btn.yes{border-color:#22c55e;color:#22c55e;width:72px;height:72px;font-size:34px}
.nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#141414;border-top:1px solid #222;display:flex;justify-content:space-around;z-index:100}
.nav button{background:none;border:none;color:#888;font-size:10px;cursor:pointer;padding:8px;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#d4af37}
.nav i{font-size:20px;font-style:normal}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:none;align-items:flex-end;z-index:200}
.modal.on{display:flex}
.min{background:#1a1a1a;width:100%;max-height:88vh;border-radius:24px 24px 0 0;padding:20px;overflow-y:auto;border-top:2px solid #d4af37}
.min h2{color:#d4af37;text-align:center;margin-bottom:6px;font-size:20px}
.min .sub{color:#888;text-align:center;font-size:13px;margin-bottom:16px}
.sec{font-size:11px;color:#d4af37;font-weight:700;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid #2a2a2a}
.mr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px}
.mr .l{color:#888}
.mr .v{font-weight:600;text-align:left}
.cl{margin-top:12px;width:100%;padding:14px;border-radius:30px;border:1px solid #333;background:transparent;color:#f0f0f0;font-size:14px;cursor:pointer}
.gb{background:#d4af37;color:#000;font-weight:700;border:none}
.mp{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:500;flex-direction:column;gap:20px;text-align:center;padding:20px}
.mp.on{display:flex}
.mp h1{color:#d4af37;font-size:36px}
.mp .em{font-size:80px}
.tst{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-100px);background:#d4af37;color:#000;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:700;transition:transform .3s;z-index:300}
.tst.on{transform:translateX(-50%) translateY(0)}
.emp{text-align:center;padding:60px 20px;color:#888;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%}
.emp h3{color:#d4af37;margin-bottom:10px}
.rst{margin-top:16px;padding:10px 24px;border-radius:30px;border:1px solid #d4af37;background:transparent;color:#d4af37;font-weight:700;cursor:pointer}

.fld{margin-bottom:12px}
.fld label{display:block;color:#888;font-size:12px;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:10px;background:#141414;border:1px solid #333;border-radius:10px;color:#f0f0f0;font-size:14px}
.login{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;z-index:1000;text-align:center}

.login .btn2{padding:14px 30px;border-radius:30px;border:none;background:#d4af37;color:#000;font-weight:700;font-size:15px;cursor:pointer;width:100%;max-width:300px}
.login input{width:100%;max-width:300px;padding:14px;background:#141414;border:1px solid #333;border-radius:30px;color:#fff;font-size:15px;text-align:center}
.chat{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;display:none;flex-direction:column;z-index:400}
.chat.on{display:flex}

.chat-back{background:none;border:none;color:#d4af37;font-size:22px;cursor:pointer;padding:0 8px}
.chat-av{width:42px;height:42px;border-radius:50%;border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:22px;background:#0a0a0a;flex-shrink:0}

.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word}

.msg.them{background:#1a1a1a;color:#f0f0f0;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.msg-time{font-size:10px;opacity:.6;margin-top:4px;display:block}
.chat-input{display:flex;gap:8px;padding:10px;background:#141414;border-top:1px solid #222;padding-bottom:max(10px,env(safe-area-inset-bottom));flex-shrink:0}

.chat-input button{padding:0 20px;background:#d4af37;color:#000;border:none;border-radius:24px;font-weight:700;font-size:14px;cursor:pointer}
.typing{align-self:flex-start;background:#1a1a1a;padding:12px 16px;border-radius:16px;display:flex;gap:4px;border:1px solid #2a2a2a}
.typing span{width:7px;height:7px;background:#666;border-radius:50%;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

<div class="login" id="loginScreen">
  <h1>❤️ منصة زواج</h1>
  <p>أدخل اسمك للبدء</p>
  <input id="loginName" placeholder="اسمك" autocomplete="off">
  <button class="btn2" onclick="doLogin()">تسجيل الدخول</button>
  <p style="font-size:11px;margin-top:20px">بياناتك محفوظة على جهازك فقط</p>
</div>

<div class="top">
  <b>❤️ منصة زواج</b>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="counter" style="color:#888;font-size:12px"></span>
    <button class="ico" onclick="openFilter()">⚙️</button>
  </div>
</div>

<div class="deck"><div class="stack" id="stack"></div></div>

<div class="btns" id="ab">
  <button class="btn yes" onclick="likeTop()">❤</button>
  <button class="btn no" onclick="skipTop()">✕</button>
</div>

<div class="nav">
  <button class="on" onclick="showSec('browse',this)"><i>🔍</i>استعراض</button>
  <button onclick="showSec('matches',this)"><i>💚</i>مطابقاتي</button>
  <button onclick="showSec('profile',this)"><i>👤</i>ملفي</button>
</div>

<div class="modal" id="m" onclick="if(event.target===this)cm()"><div class="min"><div id="mc"></div></div></div>
<div class="modal" id="filtM" onclick="if(event.target===this)cf()"><div class="min"><div id="filtC"></div></div></div>

<div class="mp" id="mp">
  <div class="em">💚🎉💚</div>
  <h1>مطابقة!</h1>
  <p id="mt" style="color:#ddd;font-size:16px"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="rst" style="background:#d4af37;color:#000;border:none;padding:12px 24px;font-weight:700" onclick="chatFromPopup()">💬 راسل الآن</button>
    <button class="rst" onclick="document.getElementById('mp').classList.remove('on')">متابعة</button>
  </div>
</div>

<div class="chat" id="chatScr">
  <div class="chat-head">
    <button class="chat-back" onclick="closeChat()">→</button>
    <div class="chat-av" id="chatAv">👤</div>
    <div class="chat-name"><b id="chatTitle">-</b><small>● متصل الآن</small></div>
    <button class="chat-back" onclick="clearThisChat()" title="حذف المحادثة">🗑️</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <input id="chatMsg" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">إرسال</button>
  </div>
</div>

<div class="tst" id="tst"></div>

function openFilter(){var cs=[""];P.forEach(function(p){if(cs.indexOf(p.country)===-1)cs.push(p.country);});var h='<h2>⚙️ تصفية</h2><div class="sub">اختر معايير البحث</div>';h+='<div class="fld"><label>العمر الأدنى: <span id="aminL">'+filt.min+"</span></label><input type=\"range\" min=\"18\" max=\"60\" value=\""+filt.min+"\" id=\"amin\" oninput=\"document.getElementById('aminL').textContent=this.value\"></div>";h+='<div class="fld"><label>العمر الأقصى: <span id="amaxL">'+filt.max+"</span></label><input type=\"range\" min=\"18\" max=\"60\" value=\""+filt.max+"\" id=\"amax\" oninput=\"document.getElementById('amaxL').textContent=this.value\"></div>";h+='<div class="fld"><label>الدولة</label><select id="fco">';cs.forEach(function(c){h+='<option value="'+c+'"'+(filt.country===c?" selected":"")+">"+(c||"كل الدول")+"</option>";});h+="</select></div>";h+='<div class="fld"><label>نوع الزواج</label><select id="fmr"><option value="">الكل</option><option value="شرعي"'+(filt.marriage==="شرعي"?" selected":"")+">شرعي</option><option value=\"مدني\""+(filt.marriage==="مدني"?" selected":"")+">مدني</option></select></div>";h+='<button class="cl gb" onclick="apFilt()">تطبيق</button>';h+='<button class="cl" onclick="clrFilt()">مسح</button>';h+='<button class="cl" onclick="cf()">إغلاق</button>';document.getElementById("filtC").innerHTML=h;document.getElementById("filtM").classList.add("on");}

function clrFilt(){filt={min:18,max:60,country:"",marriage:""};save();cf();renderStack();toast("تم المسح");}
function cf(){document.getElementById("filtM").classList.remove("on");}
function toast(msg){var t=document.getElementById("tst");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},2000);}
if(!me){document.getElementById("loginScreen").style.display="flex";}else{document.getElementById("loginScreen").style.display="none";renderStack();}
// ============ نظام المراسلة ============
var chats={};
var currentChat=null;
var autoReplies=["أهلاً وسهلاً! 😊","يسعدني تواصلك معي.","هذا نموذج تجريبي للمحادثة.","أخبرني المزيد عنك.","شكراً لرسالتك 🌹","ممكن نتعرف أكثر؟","موضوع شيق!","أنا مهتم أيضاً."];
try{var cs=localStorage.getItem("zw_chats");if(cs)chats=JSON.parse(cs);}catch(e){}
function saveChats(){try{localStorage.setItem("zw_chats",JSON.stringify(chats));}catch(e){}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function openChat(id){
  var p=P.find(function(x){return x.id===id;});
  if(!p)return;
  currentChat=id;
  document.getElementById("chatAv").textContent=p.emoji;
  document.getElementById("chatTitle").textContent=p.name||p.id;
  renderChat();
  document.getElementById("chatScr").classList.add("on");
  setTimeout(function(){var i=document.getElementById("chatMsg");if(i)i.focus();},100);
}
function renderChat(){
  var body=document.getElementById("chatBody");
  var msgs=chats[currentChat]||[];
  if(!msgs.length){
    body.innerHTML='<div style="text-align:center;color:#888;padding:30px 20px;font-size:13px;line-height:1.8">💚<br>أنتما متطابقان الآن!<br>ابدأ المحادثة بأدب واحترام</div>';
    return;
  }
  body.innerHTML=msgs.map(function(m){
    var t=new Date(m.t).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
    return '<div class="msg '+(m.me?"me":"them")+'">'+escapeHTML(m.x)+'<span class="msg-time">'+t+'</span></div>';
  }).join("");
  body.scrollTop=body.scrollHeight;
}
function sendMsg(){
  var inp=document.getElementById("chatMsg");
  var txt=inp.value.trim();
  if(!txt||!currentChat)return;
  if(!chats[currentChat])chats[currentChat]=[];
  chats[currentChat].push({t:Date.now(),me:true,x:txt});
  saveChats();inp.value="";renderChat();
  var cid=currentChat;
  setTimeout(function(){
    var body=document.getElementById("chatBody");
    var tEl=document.createElement("div");
    tEl.className="typing";tEl.id="tpx";
    tEl.innerHTML="<span></span><span></span><span></span>";
    body.appendChild(tEl);body.scrollTop=body.scrollHeight;
  },400);
  setTimeout(function(){
    var tEl=document.getElementById("tpx");if(tEl)tEl.remove();
    if(currentChat!==cid)return;
    var reply=autoReplies[Math.floor(Math.random()*autoReplies.length)];
    chats[cid].push({t:Date.now(),me:false,x:reply});
    saveChats();renderChat();sLike();
    if(navigator.vibrate)navigator.vibrate(30);
  },1500+Math.random()*1000);
}
function closeChat(){document.getElementById("chatScr").classList.remove("on");currentChat=null;}
function clearThisChat(){
  if(!currentChat)return;
  if(!confirm("حذف كل الرسائل مع هذا الشخص؟"))return;
  delete chats[currentChat];saveChats();renderChat();toast("تم حذف المحادثة");
}
function chatFromPopup(){
  var id=window._matchId;
  document.getElementById("mp").classList.remove("on");
  if(id)openChat(id);
}
// تحديث showM لتخزين معرّف المطابقة
function showM(p){
  document.getElementById("mt").textContent="أعجبت "+(p.name||p.id)+" وأعجبت بك أيضاً!";
  window._matchId=p.id;
  document.getElementById("mp").classList.add("on");
  sLike();
}
// تحديث قائمة المطابقات لإضافة زر المراسلة
function renderM(){
  var st=document.getElementById("stack");
  var h='<div style="max-width:400px;margin:0 auto;padding:16px;overflow-y:auto;max-height:calc(100vh - 140px)">';
  h+='<h2 style="color:#d4af37;text-align:center;margin-bottom:16px">💚 مطابقاتي ('+matches.length+')</h2>';
  if(!matches.length)h+='<p style="text-align:center;color:#888">لا توجد مطابقات بعد.</p>';
  matches.forEach(function(id){
    var p=P.find(function(x){return x.id===id;});
    if(!p)return;
    var cnt=(chats[id]||[]).length;
    h+='<div class="mc" style="cursor:default">';
    h+='<div class="a" onclick="om(\''+p.id+'\')" style="cursor:pointer">'+p.emoji+'</div>';
    h+='<div onclick="om(\''+p.id+'\')" style="flex:1;cursor:pointer"><div style="color:#e8c96a;font-weight:700">'+(p.name||p.id)+'</div><div style="color:#888;font-size:12px">'+p.age+' سنة • '+p.city+(cnt?' • 💬 '+cnt:'')+'</div></div>';
    h+='<button onclick="openChat(\''+p.id+'\')" style="background:#d4af37;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0">💬 راسل</button>';
    h+='</div>';
  });
  h+='</div>';
  st.innerHTML=h;
  document.getElementById("counter").textContent=matches.length+" مطابقة";
}
</script>
