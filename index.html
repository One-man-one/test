<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار</title>
</head>
<body style="background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px">
<h1 style="color:#d4af37">اختبار JavaScript</h1>
<div id="output" style="margin-top:20px;font-size:16px;line-height:2"></div>
<script>
var output = document.getElementById('output');
try {
  output.innerHTML += '✅ JavaScript يعمل<br>';
  var test = 'نص عربي';
  output.innerHTML += '✅ النص العربي: ' + test + '<br>';
  var testEmoji = '🕌 زواج';
  output.innerHTML += '✅ الإيموجي: ' + testEmoji + '<br>';
  var arr = ['عنصر1','عنصر2','عنصر3'];
  output.innerHTML += '✅ المصفوفات: ' + arr.length + '<br>';
  output.innerHTML += '<br><b style="color:#4f4">✓ كل شيء يعمل بشكل صحيح</b>';
} catch(e) {
  output.innerHTML += '<span style="color:#f55">❌ خطأ: ' + e.message + '</span>';
}
</script>
</body>
</html>
