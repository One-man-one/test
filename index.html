<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>منصة زواج - نموذج</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ctext x='50' y='72' font-size='50' text-anchor='middle' fill='%23d4af37'%3E❤%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#141414;
    --card:#1a1a1a;
    --border:#2a2a2a;
    --gold:#d4af37;
    --gold-light:#e8c96a;
    --gold-dim:rgba(212,175,55,.15);
    --text:#f0f0f0;
    --text-dim:#999;
    --radius:16px;
  }
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
  .screen{display:none;height:100vh;height:100dvh;flex-direction:column}
  .screen.active{display:flex}

  /* ===== الشريط العلوي ===== */
  .top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
  .top-bar .brand{font-size:18px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px}
  .top-bar .actions{display:flex;gap:12px;align-items:center}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:16px}
  .icon-btn:active{background:var(--gold-dim)}
  .badge{position:absolute;top:-4px;left:-4px;background:#e74c3c;color:#fff;font-size:10px;padding:2px 5px;border-radius:8px;font-weight:700}

  /* ===== المحتوى ===== */
  .content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px}

  /* ===== قسم الاستعراض ===== */
  .view-header{text-align:center;margin-bottom:20px}
  .view-header h1{font-size:26px;color:var(--gold);font-weight:800;line-height:1.3;margin-bottom:6px}
  .view-header p{font-size:13px;color:var(--text-dim)}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:10px;border-radius:30px;border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;text-align:center}
  .tab.active{background:var(--gold);color:#000;border-color:var(--gold)}
  .count-badge{display:inline-block;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:10px;font-size:11px;margin-right:6px}
  .tab.active .count-badge{background:rgba(0,0,0,.15)}

  /* ===== بطاقة الملف ===== */
  .profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
  .profile-card::before{content:'';position:absolute;top:0;right:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .card-id{font-size:13px;color:var(--gold);font-weight:700}
  .card-age{font-size:13px;color:var(--text-dim)}
  .card-location{font-size:14px;font-weight:600;margin-bottom:2px}
  .card-nationality{font-size:12px;color:var(--text-dim)}
  .card-avatar{width:60px;height:60px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--bg2);font-size:28px;flex-shrink:0}

  .card-details{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:14px 0;padding-top:12px;border-top:1px solid var(--border)}
  .detail{display:flex;justify-content:space-between;font-size:13px}
  .detail .label{color:var(--text-dim)}
  .detail .value{color:var(--text);font-weight:600}

  .card-actions{display:flex;gap:10px;margin-top:14px}
  .btn-interest{flex:1;padding:12px;border-radius:30px;border:none;background:var(--gold);color:#000;font-weight:700;font-size:14px;cursor:pointer}
  .btn-interest:active{background:var(--gold-light)}
  .btn-save{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .btn-save:active{background:var(--gold-dim)}

  /* ===== شريط التنقل السفلي ===== */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-dim);font-size:10px;cursor:pointer;padding:4px 12px;flex:1;position:relative}
  .nav-item.active{color:var(--gold)}
  .nav-item .nav-icon{font-size:20px}
  .nav-item .nav-badge{position:absolute;top:0;left:50%;background:#e74c3c;color:#fff;font-size:9px;padding:1px 4px;border-radius:8px;font-weight:700}

  /* ===== الأقسام الأخرى ===== */
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
  .empty-state .big-icon{font-size:48px;margin-bottom:16px;opacity:.5}
  .empty-state h3{color:var(--gold);font-size:18px;margin-bottom:8px}
  .empty-state p{font-size:13px;line-height:1.6}

  /* ===== نافذة التفاصيل ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;z-index:200}
  .modal-overlay.show{display:flex}
  .modal{background:var(--card);width:100%;max-height:85vh;border-radius:24px 24px 0 0;padding:20px;overflow-y:auto;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
  .modal h2{color:var(--gold);font-size:20px;margin-bottom:4px}
  .modal .sub{color:var(--text-dim);font-size:13px;margin-bottom:16px}
  .modal-details{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .modal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .modal-row .label{color:var(--text-dim)}
  .modal-row .value{color:var(--text);font-weight:600}
  .modal-actions{display:flex;gap:10px;position:sticky;bottom:0;background:var(--card);padding-top:10px}
  .btn-close-modal{width:100%;padding:14px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;cursor:pointer}

  /* ===== Toast ===== */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--gold);color:#000;padding:12px 24px;border-radius:30px;font-size:13px;font-weight:600;transition:transform .3s;z-index:300;box-shadow:0 4px 20px rgba(212,175,55,.3);max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ===== الشاشة الرئيسية ===== -->
<div id="mainScreen" class="screen active">
  <div class="top-bar">
    <div class="brand">❤️ منصة زواج</div>
    <div class="actions">
      <button class="icon-btn" onclick="showToast('تصفية متقدمة قريباً')">⚙️</button>
      <button class="icon-btn" onclick="showToast('بحث قريباً')">🔍</button>
      <button class="icon-btn" onclick="showSection('notifications')">
        🔔<span class="badge">1</span>
      </button>
    </div>
  </div>

  <div class="content" id="contentArea">
    <!-- سيتم تعبئة المحتوى هنا عبر JavaScript -->
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="showSection('browse')" data-section="browse">
      <span class="nav-icon">🔍</span><span>استعراض</span>
    </button>
    <button class="nav-item" onclick="showSection('matches')" data-section="matches">
      <span class="nav-icon">💚</span><span>مطابقاتي</span>
    </button>
    <button class="nav-item" onclick="showSection('notifications')" data-section="notifications">
      <span class="nav-icon">🔔</span><span>الإشعارات</span>
      <span class="nav-badge">1</span>
    </button>
    <button class="nav-item" onclick="showSection('profile')" data-section="profile">
      <span class="nav-icon">👤</span><span>ملفي</span>
    </button>
    <button class="nav-item" onclick="showSection('help')" data-section="help">
      <span class="nav-icon">❓</span><span>المساعدة</span>
    </button>
  </div>
</div>

<!-- ===== نافذة التفاصيل ===== -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== بيانات وهمية =====
const profiles = [
  { id:'SK-61225', age:25, city:'الرياض', nationality:'المغرب', height:166, weight:52, education:'ماجستير', work:'مهندسة', religion:'سني', polygamy:'غير منفتح على التعدد', emoji:'👩', lastSeen:'قبل ساعة' },
  { id:'SK-61297', age:23, city:'القاهرة', nationality:'يمنية', height:166, weight:55, education:'بكالوريوس', work:'معلمة', religion:'سني', polygamy:'غير منفتح على التعدد', emoji:'👩‍🦰', lastSeen:'قبل ساعة' },
  { id:'SK-70953', age:31, city:'الجديدة', nationality:'المغرب', height:170, weight:65, education:'دكتوراه', work:'طبيبة', religion:'سني', polygamy:'غير منفتح على التعدد', emoji:'👩‍⚕️', lastSeen:'قبل 3 ساعات' },
  { id:'SK-71402', age:28, city:'دبي', nationality:'مصر', height:162, weight:50, education:'بكالوريوس', work:'محاسبة', religion:'سني', polygamy:'غير منفتح على التعدد', emoji:'👩‍💼', lastSeen:'أمس' },
  { id:'SK-71888', age:26, city:'عمان', nationality:'الأردن', height:168, weight:58, education:'ماجستير', work:'صيدلانية', religion:'سني', polygamy:'غير منفتح على التعدد', emoji:'👩‍🔬', lastSeen:'قبل 30 دقيقة' },
];

const savedProfiles = new Set();
const interestedProfiles = new Set();

// ===== Manifest ديناميكي =====
const manifest = {
  name:'منصة زواج', short_name:'زواج',
  start_url:'.', display:'standalone',
  background_color:'#0a0a0a', theme_color:'#0a0a0a',
  orientation:'portrait',
  icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ctext x='50' y='72' font-size='50' text-anchor='middle' fill='%23d4af37'%3E%E2%9D%A4%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]
};
document.getElementById('manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))).catch(()=>{});
}

// ===== التنقل =====
let currentSection = 'browse';

function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.section === section);
  });
  renderContent();
}

function renderContent() {
  const area = document.getElementById('contentArea');
  switch(currentSection) {
    case 'browse': area.innerHTML = renderBrowse(); break;
    case 'matches': area.innerHTML = renderEmpty('💚','مطابقاتي','لا توجد مطابقات حتى الآن. أرسل اهتمامك للملفات التي تعجبك.'); break;
    case 'notifications': area.innerHTML = renderEmpty('🔔','الإشعارات','لديك إشعار جديد: تمت إضافة ملف شخصي جديد.'); break;
    case 'profile': area.innerHTML = renderProfile(); break;
    case 'help': area.innerHTML = renderEmpty('❓','المساعدة','للتواصل مع الدعم: support@example.com'); break;
  }
}

function renderBrowse() {
  const cards = profiles.map(p => renderCard(p)).join('');
  return `
    <div class="view-header">
      <h1>ملفات شخصية<br>مجهولة الهوية</h1>
    </div>
    <div class="tabs">
      <div class="tab active">جميع الملفات <span class="count-badge">${profiles.length}</span></div>
      <div class="tab">قائمتي المختارة <span class="count-badge">${savedProfiles.size}</span></div>
    </div>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;text-align:center">${profiles.length} ملفاً شخصياً</p>
    ${cards}
  `;
}

function renderCard(p) {
  const saved = savedProfiles.has(p.id);
  const interested = interestedProfiles.has(p.id);
  return `
    <div class="profile-card" onclick="openModal('${p.id}')">
      <div class="card-head">
        <div>
          <div class="card-id">${p.id}</div>
          <div class="card-age">${p.age} سنة</div>
        </div>
        <div class="card-avatar">${p.emoji}</div>
      </div>
      <div style="text-align:center;margin-bottom:8px">
        <div class="card-location">${p.city}, ${p.nationality}</div>
        <div class="card-nationality">آخر ظهور ${p.lastSeen}</div>
      </div>
      <div class="card-details">
        <div class="detail"><span class="label">الحالة الاجتماعية</span><span class="value">لم يسبق لها الزواج</span></div>
        <div class="detail"><span class="label">الطول</span><span class="value">${p.height} سم</span></div>
        <div class="detail"><span class="label">الوزن</span><span class="value">${p.weight} كجم</span></div>
        <div class="detail"><span class="label">التعليم</span><span class="value">${p.education}</span></div>
        <div class="detail"><span class="label">العمل</span><span class="value">${p.work}</span></div>
        <div class="detail"><span class="label">العقيدة</span><span class="value">${p.religion}</span></div>
        <div class="detail" style="grid-column:1/-1"><span class="label">تعدد الزوجات</span><span class="value">${p.polygamy}</span></div>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn-interest" onclick="sendInterest('${p.id}')" ${interested?'style="background:var(--border);color:var(--text-dim)"':''}>
          ${interested ? '✓ تم الإرسال' : 'إرسال اهتمام'}
        </button>
        <button class="btn-save" onclick="toggleSave('${p.id}')" style="${saved?'background:var(--gold-dim);border-color:var(--gold)':''}">
          ${saved ? '★' : '☆'}
        </button>
      </div>
    </div>
  `;
}

function renderEmpty(icon, title, desc) {
  return `<div class="empty-state"><div class="big-icon">${icon}</div><h3>${title}</h3><p>${desc}</p></div>`;
}

function renderProfile() {
  return `
    <div class="view-header"><h1>ملفي الشخصي</h1></div>
    <div class="profile-card">
      <div class="card-head">
        <div><div class="card-id">SK-00000</div><div class="card-age">أنا</div></div>
        <div class="card-avatar">👤</div>
      </div>
      <div class="card-details">
        <div class="detail"><span class="label">الحالة</span><span class="value">نشط</span></div>
        <div class="detail"><span class="label">الإعجابات المستلمة</span><span class="value">0</span></div>
        <div class="detail"><span class="label">الإعجابات المرسلة</span><span class="value">${interestedProfiles.size}</span></div>
        <div class="detail"><span class="label">المحفوظات</span><span class="value">${savedProfiles.size}</span></div>
      </div>
    </div>
    <button class="btn-interest" style="margin-top:16px" onclick="showToast('تعديل الملف قريباً')">تعديل الملف الشخصي</button>
  `;
}

// ===== التفاعلات =====
function sendInterest(id) {
  if (interestedProfiles.has(id)) { showToast('تم إرسال اهتمامك مسبقاً'); return; }
  interestedProfiles.add(id);
  showToast('✓ تم إرسال اهتمامك');
  renderContent();
}

function toggleSave(id) {
  if (savedProfiles.has(id)) { savedProfiles.delete(id); showToast('تمت الإزالة من القائمة'); }
  else { savedProfiles.add(id); showToast('★ تم الحفظ في القائمة المختصرة'); }
  renderContent();
}

function openModal(id) {
  const p = profiles.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalContent').innerHTML = `
    <h2>${p.id}</h2>
    <div class="sub">${p.age} سنة • ${p.city}, ${p.nationality}</div>
    <div class="modal-details">
      <div class="modal-row"><span class="label">الحالة الاجتماعية</span><span class="value">لم يسبق لها الزواج</span></div>
      <div class="modal-row"><span class="label">الطول</span><span class="value">${p.height} سم</span></div>
      <div class="modal-row"><span class="label">الوزن</span><span class="value">${p.weight} كجم</span></div>
      <div class="modal-row"><span class="label">التعليم</span><span class="value">${p.education}</span></div>
      <div class="modal-row"><span class="label">العمل</span><span class="value">${p.work}</span></div>
      <div class="modal-row"><span class="label">العقيدة</span><span class="value">${p.religion}</span></div>
      <div class="modal-row"><span class="label">تعدد الزوجات</span><span class="value">${p.polygamy}</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn-interest" onclick="sendInterest('${p.id}');closeModal()">إرسال اهتمام</button>
      <button class="btn-close-modal" onclick="closeModal()">إغلاق</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== تشغيل =====
renderContent();
</script>
</body>
</html>
